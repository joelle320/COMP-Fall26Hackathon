[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-agent-security"
version = "0.1.0"
description = "A local, independently enforced AI-agent security orchestration MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
dev = ["pytest>=8.3,<10"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools]
packages = ["sentinel"]
include-package-data = false

[tool.setuptools.package-data]
sentinel = ["default-policy.json", "security-fixtures.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

